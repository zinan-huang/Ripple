name = "Ripple"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RippleDefault", "Tri"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "Ripple"
globs = ["Ripple.+"]

[[lean_lib]]
name = "RippleDefault"
globs = ["Ripple"]

[[lean_lib]]
name = "Tri"
globs = ["Tri", "Tri.+"]

[[lean_lib]]
name = "SturmCRT"
globs = ["Ripple.Number.Modular.SturmCertificateCRT"]
