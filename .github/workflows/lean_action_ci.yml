name: Lean Action CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'paper/**'
      - '.github/workflows/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'paper/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
